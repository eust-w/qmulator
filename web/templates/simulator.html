<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/theme/dracula.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/ui">Qmulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/ui">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/simulator">模拟器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/circuit">电路可视化</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/circuit_designer">电路设计器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/examples">示例代码</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>QASM模拟器</h1>
        <p class="lead">编写并运行QASM量子汇编代码，模拟量子电路的执行过程。</p>

        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">QASM代码编辑器</h5>
                        <div>
                            <select id="qasmVersion" class="form-select form-select-sm">
                                <option value="2.0" selected>QASM 2.0</option>
                                <option value="1.0">QASM 1.0</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <textarea id="qasmEditor" class="form-control">// Bell状态示例 (QASM 2.0)
OPENQASM 2.0;
include "qelib1.inc";

qreg q[2];
creg c[2];

h q[0];
cx q[0], q[1];

measure q -> c;</textarea>
                    </div>
                    <div class="card-footer">
                        <button id="runButton" class="btn btn-primary">运行</button>
                        <button id="stepButton" class="btn btn-secondary">步骤运行</button>
                        <button id="resetButton" class="btn btn-danger">重置</button>
                        <button id="visualizeButton" class="btn btn-info text-white">可视化</button>
                        <button id="formatButton" class="btn btn-success">格式化</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">电路可视化</h5>
                    </div>
                    <div class="card-body">
                        <div id="circuitVisualization" class="circuit-container">
                            <!-- 电路可视化将在这里显示 -->
                            <div class="text-center py-5 text-muted">
                                <p>点击"可视化"按钮查看量子电路图</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">模拟结果</h5>
                    </div>
                    <div class="card-body">
                        <div id="simulationResults" class="results-container">
                            <div class="text-center py-5 text-muted">
                                <p>点击"运行"按钮查看模拟结果</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">量子态演化</h5>
                    </div>
                    <div class="card-body">
                        <div id="stateEvolution" class="state-container">
                            <div class="text-center py-5 text-muted">
                                <p>点击"步骤运行"查看量子态演化</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">示例代码</h5>
                    </div>
                    <div class="card-body">
                        <select id="exampleSelect" class="form-select mb-2">
                            <option value="" selected>选择示例...</option>
                            <option value="bell">Bell态</option>
                            <option value="teleportation">量子隐形传态</option>
                            <option value="grover">Grover算法</option>
                            <option value="deutsch">Deutsch算法</option>
                        </select>
                        <button id="loadExampleButton" class="btn btn-outline-primary">加载示例</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p>Qmulator - QASM量子汇编模拟器 &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/mode/javascript/javascript.min.js"></script>
    <script src="/assets/js/simulator.js"></script>
</body>
</html>
