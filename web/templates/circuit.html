<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/theme/dracula.min.css" rel="stylesheet">
</head>
<body>
<div style="padding:12px;background:#fff4d6;text-align:center">教学原型：当前使用独立量子位表示，不能忠实模拟一般纠缠联合态。</div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/ui">Qmulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/ui">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/simulator">模拟器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/circuit">电路可视化</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/circuit_designer">电路设计器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/examples">示例代码</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>量子电路可视化</h1>
        <p class="lead">将QASM代码转换为直观的量子电路图，帮助理解量子算法。</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">QASM代码</h5>
                        <div>
                            <select id="qasmVersion" class="form-select form-select-sm">
                                <option value="2.0" selected>QASM 2.0</option>
                                <option value="1.0">QASM 1.0</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <textarea id="qasmEditor" class="form-control">// Bell状态示例 (QASM 2.0)
OPENQASM 2.0;
include "qelib1.inc";

qreg q[2];
creg c[2];

h q[0];
cx q[0], q[1];

measure q -> c;</textarea>
                    </div>
                    <div class="card-footer">
                        <button id="visualizeButton" class="btn btn-primary">生成电路图</button>
                        <button id="exportButton" class="btn btn-secondary">导出图片</button>
                        <button id="resetButton" class="btn btn-danger">重置</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">示例代码</h5>
                    </div>
                    <div class="card-body">
                        <select id="exampleSelect" class="form-select mb-2">
                            <option value="" selected>选择示例...</option>
                            <option value="bell">Bell态</option>
                            <option value="teleportation">量子隐形传态</option>
                            <option value="grover">Grover算法</option>
                            <option value="deutsch">Deutsch算法</option>
                        </select>
                        <button id="loadExampleButton" class="btn btn-outline-primary">加载示例</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">电路图</h5>
                        <div id="animationControls" class="d-none">
                            <div class="btn-group btn-group-sm">
                                <button id="stepBackButton" class="btn btn-outline-secondary" title="后退一步">
                                    <i class="bi bi-skip-backward-fill"></i>
                                </button>
                                <button id="pauseButton" class="btn btn-outline-secondary" title="暂停">
                                    <i class="bi bi-pause-fill"></i>
                                </button>
                                <button id="playButton" class="btn btn-outline-primary" title="播放">
                                    <i class="bi bi-play-fill"></i>
                                </button>
                                <button id="stepForwardButton" class="btn btn-outline-secondary" title="前进一步">
                                    <i class="bi bi-skip-forward-fill"></i>
                                </button>
                                <button id="resetAnimationButton" class="btn btn-outline-danger" title="重置动画">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                            </div>
                            <div class="btn-group btn-group-sm ms-2">
                                <button id="slowDownButton" class="btn btn-outline-secondary" title="减慢速度">
                                    <i class="bi bi-dash-lg"></i>
                                </button>
                                <button id="speedUpButton" class="btn btn-outline-secondary" title="加快速度">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="circuitVisualization" class="circuit-container">
                            <!-- 电路可视化将在这里显示 -->
                            <div class="text-center py-5 text-muted">
                                <p>点击"生成电路图"按钮查看量子电路图</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">电路说明</h5>
                    </div>
                    <div class="card-body">
                        <div id="circuitDescription" class="description-container">
                            <div class="text-center py-5 text-muted">
                                <p>生成电路图后将显示电路说明</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p>Qmulator - QASM量子汇编模拟器 &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/mode/javascript/javascript.min.js"></script>
    <script src="/assets/js/circuit.js"></script>
</body>
</html>
