<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/theme/dracula.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/ui">Qmulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/ui">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/simulator">模拟器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/circuit">电路可视化</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/circuit_designer">电路设计器</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/examples">示例代码</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>QASM示例代码</h1>
        <p class="lead">浏览经典量子算法的QASM实现，包括Bell态、量子隐形传态等。</p>

        <div class="row">
            <div class="col-md-3">
                <div class="list-group" id="examplesList">
                    <a href="#" class="list-group-item list-group-item-action active" data-example="bell">Bell态</a>
                    <a href="#" class="list-group-item list-group-item-action" data-example="teleportation">量子隐形传态</a>
                    <a href="#" class="list-group-item list-group-item-action" data-example="grover">Grover算法</a>
                    <a href="#" class="list-group-item list-group-item-action" data-example="deutsch">Deutsch算法</a>
                    <a href="#" class="list-group-item list-group-item-action" data-example="qft">量子傅里叶变换</a>
                    <a href="#" class="list-group-item list-group-item-action" data-example="shor">Shor算法</a>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">操作</h5>
                    </div>
                    <div class="card-body">
                        <button id="runButton" class="btn btn-primary mb-2 w-100">运行示例</button>
                        <button id="visualizeButton" class="btn btn-info text-white mb-2 w-100">可视化电路</button>
                        <button id="copyButton" class="btn btn-secondary w-100">复制代码</button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" id="exampleTitle">Bell态</h5>
                        <div>
                            <span class="badge bg-primary" id="exampleVersion">QASM 2.0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="exampleDescription" class="mb-3">
                            <p>Bell态是量子纠缠的最简单例子，也称为EPR对。这个示例创建了两个量子比特的最大纠缠态。</p>
                        </div>
                        <textarea id="exampleCode" class="form-control">// Bell状态示例 (QASM 2.0)
OPENQASM 2.0;
include "qelib1.inc";

qreg q[2];
creg c[2];

h q[0];
cx q[0], q[1];

measure q -> c;</textarea>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">电路图</h5>
                    </div>
                    <div class="card-body">
                        <div id="circuitVisualization" class="circuit-container">
                            <!-- 电路可视化将在这里显示 -->
                            <div class="text-center py-5 text-muted">
                                <p>点击"可视化电路"按钮查看量子电路图</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p>Qmulator - QASM量子汇编模拟器 &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.0/mode/javascript/javascript.min.js"></script>
    <script src="/assets/js/examples.js"></script>
</body>
</html>
